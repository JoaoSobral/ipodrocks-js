appId: com.ipodrocks.app
productName: iPodRocks
# Platform icons from buildResources (resources/): icon.ico, icon.icns, icon.png
directories:
  output: out
  buildResources: resources
# Ad-hoc sign + seal the macOS bundle so Gatekeeper doesn't report "damaged".
afterSign: scripts/adhoc-sign-mac.js
files:
  - dist/**/*
  - node_modules/**/*
  - package.json
extraResources:
  - from: ffmpeg-bin
    to: ffmpeg
  - from: resources/icon.png
    to: icon.png
  - from: resources/icon.ico
    to: icon.ico
  - from: resources/icon.icns
    to: icon.icns
linux:
  target:
    - AppImage
  category: Audio
mac:
  target:
    - zip
  category: public.app-category.music
  # Ad-hoc signing only (no Developer ID). Keep hardened runtime off so the
  # unsigned/ad-hoc build runs without notarization.
  hardenedRuntime: false
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
win:
  target:
    - portable
